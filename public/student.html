<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <title>지적학 · 학생 참여</title>
  <link rel="icon" type="image/png" href="/assets/jijeok-mark.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/student.css">
  <script src="/student.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="frame header-content">
      <a class="brand" href="/join" aria-label="지적학 학생 참여">
        <img class="brand-icon" src="/assets/jijeok-mark.png" width="36" height="36" alt="">
        지적학
      </a>
      <div class="header-meta">
        <span class="surface-label">학생 화면</span>
        <span id="student-name" hidden></span>
        <span id="room-label" class="room-label" hidden></span>
      </div>
    </div>
  </header>

  <main class="frame layout" id="quiz-layout">
    <figure class="map-panel" id="cover-map">
      <div class="map-drawing">
        <img src="/assets/cadastral-map.png" alt="인접한 필지의 경계와 지번을 나타낸 지적도 예시" width="1090" height="360">
        <span class="map-compass" aria-hidden="true">N<i></i></span>
      </div>
      <figcaption><strong>지적도</strong><span>필지 경계와 지번</span></figcaption>
    </figure>

    <section class="work-panel" aria-labelledby="page-title">
      <div class="work-content">
        <div class="panel-top">
          <p id="panel-label" class="panel-label">실시간 퀴즈</p>
          <div class="question-timer" id="question-timer" hidden>
            <span class="timer-icon" aria-hidden="true"></span>
            <span id="timer-status">남은 시간</span>
            <span class="countdown" id="countdown" role="timer" aria-labelledby="timer-status" aria-live="off">00:00</span>
          </div>
        </div>
        <h1 id="page-title" tabindex="-1">수업 참여하기</h1>
        <dl class="question-source" id="question-source" hidden>
          <div id="question-category-row" hidden><dt>구분</dt><dd id="question-category"></dd></div>
          <div id="question-chapter-row" hidden><dt>챕터</dt><dd id="question-chapter"></dd></div>
          <div id="question-topic-row" hidden><dt>목차</dt><dd id="question-topic"></dd></div>
        </dl>
        <p class="intro" id="intro">강사가 알려준 입장 코드와 화면에 표시할 닉네임을 입력하세요.</p>

        <form class="join-form" id="join-form">
          <div class="field">
            <label for="room-code">입장 코드</label>
            <input id="room-code" name="code" class="code-input" type="text" placeholder="예: A1B2C3" minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="nickname">닉네임</label>
            <input id="nickname" name="nickname" type="text" placeholder="예: 필지탐험가" maxlength="20" autocomplete="nickname" required>
          </div>
          <button type="submit" class="primary-button" id="join-button">참여하기 <span aria-hidden="true">→</span></button>
        </form>

        <div class="notice" id="notice" hidden>
          <span class="notice-icon" id="notice-icon" aria-hidden="true"></span>
          <p id="notice-text"></p>
          <button type="button" class="text-button" id="retry-button" hidden>연결 다시 시도</button>
        </div>

        <form class="answer-form" id="answer-form" hidden>
          <fieldset class="choices" id="choices" aria-labelledby="page-title" hidden></fieldset>
          <div class="field" id="short-field" hidden>
            <label for="short-answer">내 답안</label>
            <input id="short-answer" name="answer" type="text" maxlength="160" autocomplete="off" placeholder="답안을 입력하세요">
          </div>
          <div class="field" id="essay-field" hidden>
            <div class="field-heading">
              <label for="essay-answer">내 답안</label>
              <span id="essay-limit">최대 2,000자</span>
            </div>
            <textarea id="essay-answer" name="essay" rows="5" maxlength="2000" aria-describedby="essay-limit" placeholder="답안을 입력하세요"></textarea>
          </div>
          <button type="submit" class="primary-button" id="answer-button">제출하기 <span aria-hidden="true">→</span></button>
        </form>

        <div class="answer-result" id="answer-result" hidden>
          <p class="result-badge" id="result-badge"></p>
          <dl class="result-details" id="result-details"></dl>
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>
        <p class="visually-hidden" id="live-update" role="status" aria-atomic="true"></p>
      </div>
    </section>
  </main>

</body>
</html>
